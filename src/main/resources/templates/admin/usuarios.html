<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXSHOP · Usuarios</title>
<link rel="stylesheet" th:href="@{/css/variables.css}">
<link rel="stylesheet" th:href="@{/css/panel.css}">
<link rel="stylesheet" th:href="@{/css/buttons.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="panel-body">
<div class="panel-layout">
<aside class="panel-sidebar">
<a th:href="@{/tienda}" class="panel-logo">NEXSHOP</a>
<nav class="panel-nav">
<a th:href="@{/admin/dashboard}" th:if="${session.rol == 'admin'}">Dashboard</a>
<a th:href="@{/admin/usuarios}" th:if="${session.rol == 'admin'}">Usuarios</a>
<a th:href="@{/admin/categorias}" th:if="${session.rol == 'admin'}">Categorías</a>
<a th:href="@{/admin/ventas}" th:if="${session.rol == 'admin'}">Ventas</a>
<a th:href="@{/vendedor/dashboard}" th:if="${session.rol == 'vendedor'}">Dashboard</a>
<a th:href="@{/vendedor/productos}" th:if="${session.rol == 'vendedor'}">Mis productos</a>
<a th:href="@{/vendedor/pedidos}" th:if="${session.rol == 'vendedor'}">Pedidos</a>
</nav>
<a th:href="@{/tienda}" class="panel-back">← Volver a la tienda</a>
<a th:href="@{/logout}" class="panel-logout">Salir</a>
</aside>
<div class="panel-main">
<header class="panel-topbar"><span class="panel-user" th:text="${session.usuario}">usuario</span></header>
<main class="panel-content">

<div class="panel-header-row">
<h1>Usuarios</h1>
<div class="panel-filters">
<a th:href="@{/admin/usuarios}" class="filter-chip">Todos</a>
<a th:href="@{/admin/usuarios(rol='usuario')}" class="filter-chip">Usuarios</a>
<a th:href="@{/admin/usuarios(rol='admin')}" class="filter-chip">Admins</a>
</div>
</div>

<div class="panel-card">
<table class="panel-table">
<tr><th>Documento</th><th>Nombre</th><th>Usuario</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr>
<tr th:each="u : ${usuarios}">
<td th:text="${u.noDocumento}">1</td><td th:text="${u.nombre}">Nombre</td>
<td th:text="${u.usuario}">usuario</td><td th:text="${u.correo}">correo</td>
<td th:text="${u.rol}">usuario</td><td th:text="${u.estado}">activo</td>
<td>
<a th:if="${u.rol != 'admin' and u.estado == 'activo'}"
th:href="@{/admin/usuario/estado(doc=${u.noDocumento},estado='bloqueado')}" class="action-link action-danger">Bloquear</a>
<a th:if="${u.rol != 'admin' and u.estado != 'activo'}"
th:href="@{/admin/usuario/estado(doc=${u.noDocumento},estado='activo')}" class="action-link action-ok">Activar</a>
</td>
</tr>
<tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="7" class="panel-empty">No hay usuarios para este filtro.</td></tr>
</table>
</div>
</main>
</div>
</div>
</body>
</html>
