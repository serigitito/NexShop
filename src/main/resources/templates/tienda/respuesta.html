<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXSHOP · Resultado del pago</title>
<link rel="stylesheet" th:href="@{/css/variables.css}">
<link rel="stylesheet" th:href="@{/css/tienda.css}">
<link rel="stylesheet" th:href="@{/css/navbar.css}">
<link rel="stylesheet" th:href="@{/css/cards.css}">
<link rel="stylesheet" th:href="@{/css/buttons.css}">
</head>
<body>
<main class="container">
<section class="checkout-section">
<h1>Resultado del pago</h1>
<div class="checkout-card result-card">
  <h2 class="result-title"
      th:text="${estado == 'APPROVED' ? 'Pago aprobado' :
               (estado == 'DECLINED' ? 'Pago rechazado' :
               (estado == 'PENDING' ? 'Pago pendiente' :
               (estado == 'EXPIRED' ? 'Transacción expirada' :
               'No pudimos confirmar el pago')))}">Resultado</h2>

  <div class="info-row"><div><span class="info-label">Referencia</span><span class="info-value" th:text="${referenceCode}">—</span></div></div>
  <div class="info-row"><div><span class="info-label">Total</span><span class="info-value" th:text="${'$' + totalRespuesta}">$0</span></div></div>

  <a th:href="@{/tienda}" class="btn-primary">Volver a la tienda</a>
</div>
</section>
</main>
</body>
</html>
