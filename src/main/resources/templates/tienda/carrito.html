<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXSHOP · Carrito</title>
<link rel="stylesheet" th:href="@{/css/variables.css}">
<link rel="stylesheet" th:href="@{/css/tienda.css}">
<link rel="stylesheet" th:href="@{/css/navbar.css}">
<link rel="stylesheet" th:href="@{/css/cards.css}">
<link rel="stylesheet" th:href="@{/css/buttons.css}">
</head>
<body>
<header class="nav"><div class="nav-container"><a class="logo" th:href="@{/tienda}">NEXSHOP</a><div class="nav-actions"><a th:href="@{/tienda}" class="btn-secondary">Seguir comprando</a></div></div></header>

<main class="container">
<section class="cart-section">
<h1>🛒 Carrito de compras</h1>

<div th:if="${#lists.isEmpty(productosCarrito)}" class="cart-empty">
  <p>Tu carrito está vacío.</p><a th:href="@{/tienda}" class="btn-primary">Ir a la tienda</a>
</div>

<div th:if="${!#lists.isEmpty(productosCarrito)}">
<table class="cart-table">
<tr><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th></tr>
<tr th:each="item : ${productosCarrito}">
  <td th:text="${item.producto.nombre}">Producto</td>
  <td th:text="${'$' + item.producto.precio}">$0</td>
  <td>
    <div class="qty-control">
      <a th:href="@{/carrito/restar(id=${item.producto.idProducto})}" class="qty-btn">−</a>
      <span class="qty-value" th:text="${item.cantidad}">1</span>
      <a th:href="@{/carrito/sumar(id=${item.producto.idProducto})}" class="qty-btn">+</a>
    </div>
  </td>
  <td th:text="${'$' + item.subtotal}">$0</td>
  <td><a th:href="@{/carrito/eliminar(id=${item.producto.idProducto})}" class="cart-remove">❌</a></td>
</tr>
</table>

<div class="cart-summary">
  <div class="row"><span>Subtotal</span><span th:text="${'$' + subtotal}">$0</span></div>
  <div class="row"><span>IVA (19%)</span><span th:text="${'$' + iva}">$0</span></div>
  <div class="row total"><span>Total</span><span th:text="${'$' + total}">$0</span></div>
  <div class="cart-actions">
    <a th:href="@{/tienda}" class="btn-secondary">← Seguir comprando</a>
    <a th:href="@{/checkout}" class="btn-primary">💳 Finalizar compra</a>
  </div>
  <a th:href="@{/carrito/vaciar}" class="cart-clear">Vaciar carrito</a>
</div>
</div>
</section>
</main>
</body>
</html>
