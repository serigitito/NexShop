<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXSHOP · Login</title>
<link rel="stylesheet" th:href="@{/css/variables.css}">
<link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <span class="auth-eyebrow">NEXSHOP</span>
    <h1>Bienvenido de nuevo</h1>
    <p class="auth-sub">Inicia sesión para continuar</p>

    <div th:if="${param.error != null and param.error[0] == 'bloqueado'}" class="auth-alert alert-error">
      Tu cuenta está bloqueada. Contacta al administrador.
    </div>
    <div th:if="${param.error != null and param.error[0] != 'bloqueado'}" class="auth-alert alert-error">
      Usuario o contraseña incorrectos
    </div>
    <div th:if="${param.registro != null and param.registro[0] == 'ok'}" class="auth-alert alert-success">
      Cuenta creada con éxito, ya puedes iniciar sesión
    </div>

    <form method="POST" th:action="@{/auth/login}" class="auth-form">
      <div class="auth-field">
        <label>Usuario</label>
        <input type="text" name="usuario" placeholder="Tu usuario" required>
      </div>
      <div class="auth-field">
        <label>Contraseña</label>
        <input type="password" name="contrasena" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary">Ingresar</button>
    </form>

    <div class="auth-footer">
      ¿No tienes cuenta? <a th:href="@{/registro}">Crear cuenta</a>
    </div>
  </div>
</div>
</body>
</html>
