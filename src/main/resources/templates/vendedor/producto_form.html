<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXSHOP · Producto</title>
<link rel="stylesheet" th:href="@{/css/variables.css}">
<link rel="stylesheet" th:href="@{/css/panel.css}">
<link rel="stylesheet" th:href="@{/css/buttons.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="panel-body">
<div class="panel-layout">
<aside class="panel-sidebar">
<a th:href="@{/tienda}" class="panel-logo">NEXSHOP</a>
<nav class="panel-nav">
<a th:href="@{/admin/dashboard}" th:if="${session.rol == 'admin'}">Dashboard</a>
<a th:href="@{/admin/usuarios}" th:if="${session.rol == 'admin'}">Usuarios</a>
<a th:href="@{/admin/categorias}" th:if="${session.rol == 'admin'}">Categorías</a>
<a th:href="@{/admin/ventas}" th:if="${session.rol == 'admin'}">Ventas</a>
<a th:href="@{/vendedor/dashboard}" th:if="${session.rol == 'vendedor'}">Dashboard</a>
<a th:href="@{/vendedor/productos}" th:if="${session.rol == 'vendedor'}">Mis productos</a>
<a th:href="@{/vendedor/pedidos}" th:if="${session.rol == 'vendedor'}">Pedidos</a>
</nav>
<a th:href="@{/tienda}" class="panel-back">← Volver a la tienda</a>
<a th:href="@{/logout}" class="panel-logout">Salir</a>
</aside>
<div class="panel-main">
<header class="panel-topbar"><span class="panel-user" th:text="${session.usuario}">usuario</span></header>
<main class="panel-content">

<div class="panel-header-row"><h1 th:text="${producto == null ? 'Nuevo producto' : 'Editar producto'}">Producto</h1></div>
<div th:if="${param.error != null and param.error[0] == 'imagen'}" class="panel-alert">Debes subir una imagen para crear el producto.</div>
<div class="panel-card panel-card-narrow">
<form th:action="@{/vendedor/producto/guardar}" method="POST" enctype="multipart/form-data" class="panel-form">
<input type="hidden" name="idProducto" th:value="${producto == null ? 0 : producto.idProducto}">
<label>Nombre del producto<input type="text" name="nombre" th:value="${producto == null ? '' : producto.nombre}" required></label>
<label>Precio (COP)<input type="number" name="precio" step="1" min="1" th:value="${producto == null ? '' : producto.precio}" required></label>
<label>Categoría<input type="text" name="categoria" th:value="${producto == null ? '' : producto.categoria}" required></label>
<label>Imagen<input type="file" name="imagen" accept=".jpg,.jpeg,.png,.webp"></label>
<img th:if="${producto != null}" th:src="${producto.imagen}" alt="" class="form-preview">
<div class="panel-form-actions"><a th:href="@{/vendedor/productos}" class="btn-secondary">Cancelar</a><button class="btn-primary" type="submit">Guardar</button></div>
</form>
</div>
</main>
</div>
</div>
</body>
</html>
