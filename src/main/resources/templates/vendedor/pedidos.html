<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXSHOP · Pedidos</title>
<link rel="stylesheet" th:href="@{/css/variables.css}">
<link rel="stylesheet" th:href="@{/css/panel.css}">
<link rel="stylesheet" th:href="@{/css/buttons.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="panel-body">
<div class="panel-layout">
<aside class="panel-sidebar">
<a th:href="@{/tienda}" class="panel-logo">NEXSHOP</a>
<nav class="panel-nav">
<a th:href="@{/admin/dashboard}" th:if="${session.rol == 'admin'}">Dashboard</a>
<a th:href="@{/admin/usuarios}" th:if="${session.rol == 'admin'}">Usuarios</a>
<a th:href="@{/admin/categorias}" th:if="${session.rol == 'admin'}">Categorías</a>
<a th:href="@{/admin/ventas}" th:if="${session.rol == 'admin'}">Ventas</a>
<a th:href="@{/vendedor/dashboard}" th:if="${session.rol == 'vendedor'}">Dashboard</a>
<a th:href="@{/vendedor/productos}" th:if="${session.rol == 'vendedor'}">Mis productos</a>
<a th:href="@{/vendedor/pedidos}" th:if="${session.rol == 'vendedor'}">Pedidos</a>
</nav>
<a th:href="@{/tienda}" class="panel-back">← Volver a la tienda</a>
<a th:href="@{/logout}" class="panel-logout">Salir</a>
</aside>
<div class="panel-main">
<header class="panel-topbar"><span class="panel-user" th:text="${session.usuario}">usuario</span></header>
<main class="panel-content">

<div class="panel-header-row"><h1>Mis pedidos</h1>
<form th:action="@{/vendedor/pedidos}" method="GET" class="panel-search"><input type="text" name="q" placeholder="Buscar por # de venta..." th:value="${busqueda}"><button type="submit">🔎</button></form>
</div>
<div class="panel-card">
<table class="panel-table">
<tr><th>#</th><th>Fecha</th><th>Pago</th><th>Total</th><th>Estado de envío</th></tr>
<tr th:each="p : ${pedidos}">
<td th:text="${'#' + p.idVenta}">#1</td><td th:text="${p.fecha}">2026-01-01</td><td th:text="${p.estado}">Pagada</td><td th:text="${'$' + p.costoFinal}">$0</td>
<td><form th:action="@{/vendedor/pedido/estado}" method="GET" class="inline-form"><input type="hidden" name="id" th:value="${p.idVenta}">
<select name="estado" onchange="this.form.submit()"><option value="Preparando" th:selected="${p.estadoEnvio == 'Preparando'}">Preparando</option><option value="Enviado" th:selected="${p.estadoEnvio == 'Enviado'}">Enviado</option><option value="Entregado" th:selected="${p.estadoEnvio == 'Entregado'}">Entregado</option></select></form></td>
</tr>
<tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="5" class="panel-empty">No tienes pedidos todavía.</td></tr>
</table>
</div>
</main>
</div>
</div>
</body>
</html>
